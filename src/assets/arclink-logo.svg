<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;display=swap');
    </style>
  </defs>

  <!-- ── Icon mark ── -->
  <!-- Outer licorice arc, open bottom-left, ~290° sweep -->
  <path
    d="M 60 18 A 42 42 0 1 1 24 78"
    stroke="#29233B" stroke-width="11" stroke-linecap="round" fill="none"
  />
  <!-- Licorice filled circle -->
  <circle cx="60" cy="60" r="19" fill="#29233B"/>
  <!-- Gumdrop centre dot -->
  <circle cx="60" cy="60" r="10" fill="#4A9FE8"/>
  <!-- Jelly smile arc -->
  <path
    d="M 34 83 A 28 28 0 0 0 86 83"
    stroke="#6B5CA5" stroke-width="11" stroke-linecap="round" fill="none"
  />

  <!-- ── Wordmark ── -->
  <text
    x="112" y="82"
    font-family="'Instrument Serif', Georgia, serif"
    font-size="68"
    font-weight="400"
    fill="#29233B"
    letter-spacing="-0.5"
  >ArcLink</text>
</svg>
